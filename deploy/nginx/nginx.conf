worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  log_format structured escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","method":"$request_method","uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","http_referer":"$http_referer","user_agent":"$http_user_agent"}';

  access_log /dev/stdout structured;
  error_log /dev/stderr warn;

  include /etc/nginx/conf.d/*.conf;
}
