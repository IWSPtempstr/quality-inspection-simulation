server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  default_type application/json;

  location = /.well-known/openid-configuration {
    try_files /.well-known/openid-configuration =404;
  }

  location = /realms/detection-center/protocol/openid-connect/certs {
    try_files /realms/detection-center/protocol/openid-connect/certs =404;
  }

  location /notifications {
    if ($request_method = OPTIONS) {
      add_header Allow "OPTIONS, POST";
      return 204;
    }
    if ($request_method = POST) {
      return 202;
    }
    return 200;
  }

  location ~ ^/internal/v1/centers/.+/schedule-versions/[0-9]+$ {
    if ($request_method = OPTIONS) {
      add_header Allow "OPTIONS, PUT";
      return 204;
    }
    if ($request_method = PUT) {
      return 204;
    }
    return 200;
  }

  location / {
    return 200;
  }
}
