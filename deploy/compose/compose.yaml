name: detection-center

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    depends_on:
      api-go:
        condition: service_started
    ports:
      - "${EDGE_HTTP_PORT:-8080}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [edge, internal]
    restart: unless-stopped
    logging: *default-logging

  api-go:
    build:
      context: ../..
      dockerfile: deploy/compose/api-go.Dockerfile
      target: api-runtime
    env_file:
      - ./env/api-go.env.example
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      ops-stub:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  api-worker:
    build:
      context: ../..
      dockerfile: deploy/compose/api-go.Dockerfile
      target: worker-runtime
    env_file:
      - ./env/api-go.env.example
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      ops-stub:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  ai-service:
    build:
      context: ../..
      dockerfile: deploy/compose/ai-py.Dockerfile
    env_file:
      - ./env/ai-py.env.example
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  scheduler:
    build:
      context: ../..
      dockerfile: deploy/compose/scheduler-py.Dockerfile
    env_file:
      - ./env/scheduler-py.env.example
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    env_file:
      - ./env/postgres.env.example
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    env_file:
      - ./env/rabbitmq.env.example
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:0.5.23}
    env_file:
      - ./env/chroma.env.example
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; urls=('http://127.0.0.1:8000/api/v2/heartbeat','http://127.0.0.1:8000/api/v1/heartbeat');\nfor url in urls:\n  try:\n    urllib.request.urlopen(url, timeout=2)\n    sys.exit(0)\n  except Exception:\n    pass\nsys.exit(1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  ops-stub:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    volumes:
      - ../nginx/stub.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/oidc:/usr/share/nginx/html:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/.well-known/openid-configuration",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.25.0}
    profiles: ["observability"]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      blackbox-exporter:
        condition: service_started
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging

  chroma-backup:
    image: ${OPS_TOOL_IMAGE:-alpine:3.20}
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/scripts/backup-chroma.sh"]
    volumes:
      - chroma_data:/data:ro
      - chroma_backups:/backups
      - ./scripts:/scripts:ro
    networks: [internal]
    logging: *default-logging

  chroma-restore:
    image: ${OPS_TOOL_IMAGE:-alpine:3.20}
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/scripts/restore-chroma.sh"]
    volumes:
      - chroma_data:/data
      - chroma_backups:/backups:ro
      - ./scripts:/scripts:ro
    networks: [internal]
    logging: *default-logging

networks:
  edge: {}
  internal: {}

volumes:
  postgres_data: {}
  rabbitmq_data: {}
  redis_data: {}
  chroma_data: {}
  chroma_backups: {}
  prometheus_data: {}
