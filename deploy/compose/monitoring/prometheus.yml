global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:8080/readyz
          - http://api-go:8080/readyz
          - http://ai-service:8080/healthz
          - http://scheduler:8080/healthz
          - http://ops-stub:8080/.well-known/openid-configuration
          - http://ops-stub:8080/notifications
          - http://ops-stub:8080/internal/v1/centers/health/schedule-versions/1
          - http://chroma:8000/api/v2/heartbeat
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - rabbitmq:5672
          - redis:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
