{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>事件中心</h1>
  <p>处理设备故障、人员不可用、耗材不足、手动重排和检测完成等排程事件。</p>
</section>

<section class="panel stack">
  <div class="toolbar">
    <button type="button" data-action="events-load">刷新事件</button>
    <button type="button" data-action="events-heartbeat">触发排程心跳</button>
    <div id="events-status" class="status-line" aria-live="polite">等待加载</div>
  </div>

  <form id="events-filter-form" class="filters" autocomplete="off">
    <fieldset>
      <legend>筛选事件</legend>
      <label>状态
        <select name="status">
          <option value="">全部状态</option>
          <option value="pending">待处理</option>
          <option value="processing">处理中</option>
          <option value="done">已处理</option>
          <option value="ignored">已忽略</option>
          <option value="failed">失败</option>
        </select>
      </label>
      <label>事件类型
        <input name="event_type" placeholder="equipment_fault…" autocomplete="off">
      </label>
      <button type="submit">应用筛选</button>
    </fieldset>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>事件</th>
          <th>等级</th>
          <th>对象</th>
          <th>状态</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="events-table-body">
        <tr><td colspan="6" class="empty">等待加载</td></tr>
      </tbody>
    </table>
  </div>

  <section aria-labelledby="event-detail-title">
    <h2 id="event-detail-title">处理建议</h2>
    <div id="event-detail" class="detail-panel" aria-live="polite">
      <div class="empty">选择事件查看建议。</div>
    </div>
  </section>
</section>
{% endblock %}
