{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>订单管理</h1>
  <p>创建、筛选、查看、修改、取消和复检检测订单。</p>
</section>

<div class="grid">
  <section class="panel stack" aria-labelledby="create-order-title">
    <h2 id="create-order-title">创建订单</h2>
    <form id="order-form" autocomplete="off">
      <label>订单类型
        <select name="order_type">
          <option value="normal">普通订单</option>
          <option value="urgent">加急订单</option>
          <option value="vip">VIP订单</option>
        </select>
      </label>
      <label>样品名称
        <input name="sample_name" placeholder="输入样品名称…" autocomplete="off" required>
      </label>
      <label>样品数量
        <input name="sample_quantity" type="number" inputmode="numeric" min="1" value="1" required>
      </label>
      <label>认证类型
        <select name="certification_type">
          <option value="ccc">CCC认证</option>
          <option value="cvc">CVC认证</option>
          <option value="international">国际认证</option>
        </select>
      </label>
      <label>承诺完成时间
        <input name="promised_finish_time" type="datetime-local" autocomplete="off">
      </label>
      <button type="submit">创建订单</button>
      <div id="orders-create-status" class="status-line" role="alert" aria-live="polite"></div>
    </form>
  </section>

  <section class="panel stack" aria-labelledby="order-detail-title">
    <h2 id="order-detail-title">订单详情</h2>
    <div id="order-detail" class="detail-panel" aria-live="polite">
      <div class="empty">从订单列表选择一条记录。</div>
    </div>
  </section>
</div>

<section class="panel stack">
  <div class="section-heading">
    <div>
      <h2>订单列表</h2>
      <p>默认隐藏已取消订单，可通过筛选显示。</p>
    </div>
    <div id="orders-list-status" class="status-line" aria-live="polite">等待加载</div>
  </div>

  <form id="orders-filter-form" class="filters" autocomplete="off">
    <fieldset>
      <legend>筛选订单</legend>
      <label>关键词
        <input name="q" placeholder="订单号或样品名称…" autocomplete="off">
      </label>
      <label>订单类型
        <select name="order_type">
          <option value="">全部类型</option>
          <option value="normal">普通订单</option>
          <option value="urgent">加急订单</option>
          <option value="vip">VIP订单</option>
        </select>
      </label>
      <label>认证类型
        <select name="certification_type">
          <option value="">全部认证</option>
          <option value="ccc">CCC认证</option>
          <option value="cvc">CVC认证</option>
          <option value="international">国际认证</option>
        </select>
      </label>
      <label>状态
        <select name="status">
          <option value="">全部状态</option>
          <option value="pending">待排程</option>
          <option value="scheduled">已排程</option>
          <option value="running">运行中</option>
          <option value="completed">已完成</option>
          <option value="blocked">阻塞</option>
          <option value="cancelled">已取消</option>
        </select>
      </label>
      <label class="checkbox-row">
        <input name="include_cancelled" type="checkbox">
        显示已取消
      </label>
      <button type="submit">应用筛选</button>
      <button type="button" data-action="orders-reset">清除筛选</button>
    </fieldset>
  </form>

  <div class="table-wrap">
    <table id="orders-table">
      <thead>
        <tr>
          <th>订单号</th>
          <th>类型</th>
          <th>样品</th>
          <th>数量</th>
          <th>认证</th>
          <th>状态</th>
          <th>承诺完成</th>
          <th>路线</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="orders-table-body">
        <tr><td colspan="9" class="empty">等待加载</td></tr>
      </tbody>
    </table>
  </div>

  <details class="debug-panel">
    <summary>查看原始订单响应</summary>
    <pre id="orders-debug" aria-live="polite">等待加载</pre>
  </details>
</section>
{% endblock %}
