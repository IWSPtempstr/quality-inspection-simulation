{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>检测队列仪表盘</h1>
  <p>查看当前队列、SLA、设备负载和事件闭环状态。</p>
</section>

<section class="management-layout">
<div class="stack">
<section class="panel stack">
  <div class="toolbar">
    <button type="button" data-action="dashboard-refresh">刷新监测报告</button>
    <div id="dashboard-status" class="status-line" aria-live="polite">等待加载</div>
  </div>

  <div id="metric-cards" class="cards" aria-live="polite"></div>

  <div class="grid two">
    <section aria-labelledby="event-title">
      <h2 id="event-title">事件闭环</h2>
      <div id="event-status-cards" class="cards compact" aria-live="polite"></div>
      <h3>待处理事件</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>事件</th>
              <th>等级</th>
              <th>对象</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="open-events-body">
            <tr><td colspan="4" class="empty">等待加载</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <details class="debug-panel">
    <summary>查看原始监测报告</summary>
    <pre id="dashboard-debug" aria-live="polite">等待加载</pre>
  </details>
</section>
</div>
<aside class="assistant-panel" aria-labelledby="assistant-title">
  <div class="section-heading">
    <div>
      <h2 id="assistant-title">调度助手</h2>
      <p>基于当前队列和事件给出业务建议。</p>
    </div>
  </div>
  <p>今日重点关注环境试验箱负载、EMC 人员窗口和 VIP 订单 SLA 风险。建议先比较策略，再人工确认是否重排。</p>
  <div class="actions">
    <a class="button-link" href="/queue">查看策略</a>
    <a class="button-link" href="/events">处理事件</a>
  </div>
  <div class="note-box">
    <strong>操作原则</strong>
    <span>系统只给建议；创建订单、触发重排和执行回写都需要人工确认。</span>
  </div>
</aside>
</section>
{% endblock %}
