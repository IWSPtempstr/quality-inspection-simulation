{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>审计日志</h1>
  <p>追踪订单、排程、执行、事件和通知的关键操作。</p>
</section>

<section class="panel stack">
  <div class="toolbar">
    <button type="button" data-action="audit-load">刷新审计日志</button>
    <div id="audit-status" class="status-line" aria-live="polite">等待加载</div>
  </div>

  <form id="audit-filter-form" class="filters" autocomplete="off">
    <fieldset>
      <legend>筛选审计</legend>
      <label>动作
        <input name="action" placeholder="step_started…" autocomplete="off">
      </label>
      <label>目标类型
        <input name="target_type" placeholder="schedule_step…" autocomplete="off">
      </label>
      <label>目标 ID
        <input name="target_id" placeholder="可选" autocomplete="off">
      </label>
      <button type="submit">应用筛选</button>
    </fieldset>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>用户</th>
          <th>角色</th>
          <th>动作</th>
          <th>目标</th>
          <th>时间</th>
          <th>详情</th>
        </tr>
      </thead>
      <tbody id="audit-table-body">
        <tr><td colspan="6" class="empty">等待加载</td></tr>
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
