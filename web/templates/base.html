<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F7F8">
  <title>{{ title }} - 电器产品检测排程后台</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="{{ request.url.path }}">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar">
    <div class="brand">电器产品检测排程后台</div>
    <nav aria-label="主导航">
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>仪表盘</a>
      <a href="/orders" {% if request.url.path == "/orders" %}aria-current="page"{% endif %}>订单</a>
      <a href="/queue" {% if request.url.path == "/queue" %}aria-current="page"{% endif %}>队列</a>
      <a href="/execution" {% if request.url.path == "/execution" %}aria-current="page"{% endif %}>执行</a>
      <a href="/events" {% if request.url.path == "/events" %}aria-current="page"{% endif %}>事件</a>
      <a href="/notifications" {% if request.url.path == "/notifications" %}aria-current="page"{% endif %}>通知</a>
      <a href="/audit" {% if request.url.path == "/audit" %}aria-current="page"{% endif %}>审计</a>
    </nav>
  </header>
  <main id="main-content" class="page" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
