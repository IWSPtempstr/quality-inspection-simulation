{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Agent 执行轨迹</h1>
  <p>调用 LangGraph Orchestrator，并查看 visited_agents 与 handoffs。</p>
</section>

<section class="panel stack">
  <form id="agent-form" class="filters" autocomplete="off">
    <fieldset>
      <legend>Agent 任务</legend>
      <label>任务类型
        <select name="task_type">
          <option value="query_queue">查询队列</option>
          <option value="analyze_schedule_options">分析排程策略</option>
          <option value="query_notifications">查询通知</option>
          <option value="analyze_exception">分析异常</option>
        </select>
      </label>
      <button type="submit">运行 Agent</button>
    </fieldset>
  </form>
  <div id="agent-status" class="status-line" role="alert" aria-live="polite"></div>
  <div class="grid two">
    <section>
      <h2>访问节点</h2>
      <ol id="agent-visited" class="timeline" aria-live="polite"></ol>
    </section>
    <section>
      <h2>定向交接</h2>
      <div id="agent-handoffs" class="result-list" aria-live="polite">
        <div class="empty">运行后显示 handoff。</div>
      </div>
    </section>
  </div>
  <details class="debug-panel">
    <summary>查看原始 Agent 响应</summary>
    <pre id="agent-debug" aria-live="polite">等待操作</pre>
  </details>
</section>
{% endblock %}
