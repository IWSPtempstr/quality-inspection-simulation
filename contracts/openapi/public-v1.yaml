openapi: 3.1.0
info:
  title: Detection Scheduling Workbench API
  version: 1.0.0
  description: Human-approved scheduling API for an electrical-product testing center.
servers:
  - url: /api/v1
security:
  - OidcSessionCookie: []
paths:
  /auth/login:
    get:
      operationId: startLogin
      security: []
      parameters: [ { name: return_to, in: query, required: false, schema: { type: string, default: / } } ]
      responses: { '302': { description: Redirect to configured OIDC provider }, '400': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/callback:
    get:
      operationId: completeLogin
      security: []
      parameters: [ { name: state, in: query, required: true, schema: { type: string } }, { name: code, in: query, required: true, schema: { type: string } } ]
      responses: { '302': { description: Redirect to validated local return path }, '400': { $ref: '#/components/responses/Problem' }, '502': { $ref: '#/components/responses/Problem' } }
  /auth/csrf:
    get:
      operationId: getCsrfToken
      responses: { '200': { $ref: '#/components/responses/CsrfTokenResponse' }, '401': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/logout:
    post:
      operationId: logout
      parameters: [ { $ref: '#/components/parameters/CsrfToken' } ]
      responses: { '204': { description: Logged out }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /session/me:
    get:
      operationId: getSession
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
  /projects:
    get:
      operationId: listDetectionProjects
      responses: { '200': { $ref: '#/components/responses/DetectionProjectList' } }
  /orders:
    get:
      operationId: listOrders
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Query' } ]
      responses: { '200': { $ref: '#/components/responses/OrderPage' } }
    post:
      operationId: createOrder
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } } }
      responses: { '201': { $ref: '#/components/responses/OrderResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /orders/{order_id}:
    parameters: [ { $ref: '#/components/parameters/OrderId' } ]
    get:
      operationId: getOrder
      responses: { '200': { $ref: '#/components/responses/OrderResponse' }, '404': { $ref: '#/components/responses/Problem' } }
    patch:
      operationId: updateOrder
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPatch' } } } }
      responses: { '200': { $ref: '#/components/responses/OrderResponse' }, '409': { $ref: '#/components/responses/Problem' } }
    delete:
      operationId: cancelOrder
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '204': { description: Cancelled }, '409': { $ref: '#/components/responses/Problem' } }
  /orders/{order_id}/retests:
    post:
      operationId: createRetest
      parameters: [ { $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRetestRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/OrderResponse' } }
  /orders/{order_id}/pause:
    post:
      operationId: pauseOrder
      parameters: [ { $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PauseOrderRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/OrderResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /orders/{order_id}/resume:
    post:
      operationId: resumeOrder
      parameters: [ { $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '200': { $ref: '#/components/responses/OrderResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /resources/equipment:
    get: { operationId: listEquipment, responses: { '200': { $ref: '#/components/responses/EquipmentList' } } }
  /resources/employees:
    get: { operationId: listEmployees, responses: { '200': { $ref: '#/components/responses/EmployeeList' } } }
  /resources/shifts:
    get: { operationId: listShifts, responses: { '200': { $ref: '#/components/responses/ShiftList' } } }
  /resources/unavailability:
    get: { operationId: listUnavailability, responses: { '200': { $ref: '#/components/responses/UnavailabilityList' } } }
  /schedules/current:
    get: { operationId: getCurrentSchedule, responses: { '200': { $ref: '#/components/responses/ScheduleResponse' } } }
  /schedule-previews:
    get: { operationId: listSchedulePreviews, responses: { '200': { $ref: '#/components/responses/SchedulePreviewPage' } } }
    post:
      operationId: createSchedulePreview
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { event_ids: { type: array, items: { type: string } } } } } } }
      responses: { '202': { $ref: '#/components/responses/SchedulePreviewResponse' } }
  /schedule-previews/{preview_id}:
    parameters: [ { $ref: '#/components/parameters/PreviewId' } ]
    get: { operationId: getSchedulePreview, responses: { '200': { $ref: '#/components/responses/SchedulePreviewResponse' } } }
  /schedule-previews/{preview_id}/explanation:
    post:
      operationId: explainSchedulePreview
      parameters: [ { $ref: '#/components/parameters/PreviewId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExplanationRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ScheduleExplanationResponse' }, '503': { $ref: '#/components/responses/Problem' } }
  /schedule-previews/preflight:
    post:
      operationId: preflightScheduleDataQuality
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DataQualityPreflightRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/DataQualityPreflightResponse' }, '503': { $ref: '#/components/responses/Problem' } }
  /schedule-previews/{preview_id}/approve:
    post:
      operationId: approveSchedulePreview
      parameters: [ { $ref: '#/components/parameters/PreviewId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '200': { $ref: '#/components/responses/SchedulePreviewResponse' }, '409': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /schedule-previews/{preview_id}/reject:
    post:
      operationId: rejectSchedulePreview
      parameters: [ { $ref: '#/components/parameters/PreviewId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '200': { $ref: '#/components/responses/SchedulePreviewResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /schedule-steps/{step_id}/start:
    patch:
      operationId: startScheduleStep
      parameters: [ { $ref: '#/components/parameters/StepId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '200': { $ref: '#/components/responses/ScheduleStepResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /schedule-steps/{step_id}/complete:
    patch:
      operationId: completeScheduleStep
      parameters: [ { $ref: '#/components/parameters/StepId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '200': { $ref: '#/components/responses/ScheduleStepResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /events:
    get: { operationId: listEvents, responses: { '200': { $ref: '#/components/responses/EventPage' } } }
  /events/{event_id}:
    get: { operationId: getEvent, parameters: [ { $ref: '#/components/parameters/EventId' } ], responses: { '200': { $ref: '#/components/responses/EventResponse' } } }
  /events/{event_id}/diagnose:
    post:
      operationId: diagnoseEvent
      parameters: [ { $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/DiagnosisResponse' }, '503': { $ref: '#/components/responses/Problem' } }
  /events/{event_id}/case-candidates:
    post:
      operationId: createExceptionCaseCandidate
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      responses: { '200': { $ref: '#/components/responses/ExceptionCaseCandidateResponse' }, '503': { $ref: '#/components/responses/Problem' } }
  /exception-case-candidates/{candidate_id}/submit:
    post:
      operationId: submitExceptionCaseCandidate
      parameters: [ { $ref: '#/components/parameters/CaseCandidateId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionCaseCandidateSubmission' } } } }
      responses: { '201': { $ref: '#/components/responses/ExceptionCaseReviewResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /events/{event_id}/close:
    post:
      operationId: closeEvent
      parameters: [ { $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventCloseRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/EventResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /events/{event_id}/acknowledge:
    post:
      operationId: acknowledgeEvent
      parameters: [ { $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses: { '200': { $ref: '#/components/responses/EventResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /knowledge/query:
    post:
      operationId: queryKnowledge
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [query], properties: { query: { type: string, minLength: 1 } } } } } }
      responses: { '200': { $ref: '#/components/responses/KnowledgeResponse' }, '503': { $ref: '#/components/responses/Problem' } }
  /knowledge/impact-analysis:
    post:
      operationId: analyzeKnowledgeImpact
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [standard_version_id], properties: { standard_version_id: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/KnowledgeResponse' } }
  /notifications:
    get: { operationId: listNotifications, responses: { '200': { $ref: '#/components/responses/NotificationPage' } } }
  /notifications/{notification_id}/read:
    patch:
      operationId: readNotification
      parameters: [ { $ref: '#/components/parameters/NotificationId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '204': { description: Marked read } }
  /notification-drafts:
    post:
      operationId: createNotificationDraft
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDraftRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/NotificationDraftResponse' }, '503': { $ref: '#/components/responses/Problem' } }
  /notification-drafts/{draft_id}/send:
    post:
      operationId: sendNotificationDraft
      parameters: [ { $ref: '#/components/parameters/NotificationDraftId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDraftSendRequest' } } } }
      responses: { '202': { $ref: '#/components/responses/NotificationDeliveryResponse' }, '409': { $ref: '#/components/responses/Problem' } }
  /audit-logs:
    get: { operationId: listAuditLogs, responses: { '200': { $ref: '#/components/responses/AuditPage' } } }
  /audit-logs/filter-suggestions:
    post:
      operationId: suggestAuditFilters
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuditFilterSuggestionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AuditFilterSuggestionResponse' }, '503': { $ref: '#/components/responses/Problem' } }
  /system/health:
    get: { operationId: getSystemHealth, responses: { '200': { $ref: '#/components/responses/HealthResponse' } } }
components:
  securitySchemes:
    OidcSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-public_session
      description: OIDC-authenticated BFF session cookie for same-origin browser requests. The BFF sets this cookie after the OIDC login flow with HttpOnly, Secure, and SameSite protections; the React client does not attach a Bearer token and the browser sends the cookie automatically. The BFF validates the OIDC-authenticated session and derives actor identity, center scope, and roles exclusively from verified claims.
  parameters:
    CsrfToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
    Query: { name: q, in: query, schema: { type: string } }
    OrderId: { name: order_id, in: path, required: true, schema: { type: string } }
    PreviewId: { name: preview_id, in: path, required: true, schema: { type: string } }
    StepId: { name: step_id, in: path, required: true, schema: { type: string } }
    EventId: { name: event_id, in: path, required: true, schema: { type: string } }
    NotificationId: { name: notification_id, in: path, required: true, schema: { type: string } }
    CaseCandidateId: { name: candidate_id, in: path, required: true, schema: { type: string } }
    NotificationDraftId: { name: draft_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Problem: { description: Problem details, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    SessionResponse: { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
    CsrfTokenResponse: { description: Session-bound CSRF token, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
    OrderResponse: { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
    DetectionProjectList: { description: Center-selectable detection projects, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DetectionProject' } } } } }
    OrderPage: { description: Order page, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }
    EquipmentList: { description: Equipment, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Equipment' } } } } }
    EmployeeList: { description: Employees, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Employee' } } } } }
    ShiftList: { description: Shifts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Shift' } } } } }
    UnavailabilityList: { description: Unavailability, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unavailability' } } } } }
    ScheduleResponse: { description: Schedule, content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
    ScheduleStepResponse: { description: Schedule step, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleStep' } } } }
    SchedulePreviewResponse: { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/SchedulePreview' } } } }
    SchedulePreviewPage: { description: Preview page, content: { application/json: { schema: { $ref: '#/components/schemas/SchedulePreviewPage' } } } }
    EventResponse: { description: Event, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
    EventPage: { description: Event page, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
    DiagnosisResponse: { description: Diagnosis, content: { application/json: { schema: { $ref: '#/components/schemas/Diagnosis' } } } }
    ScheduleExplanationResponse: { description: Deterministic preview explanation, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExplanation' } } } }
    DataQualityPreflightResponse: { description: Deterministic data-quality preflight, content: { application/json: { schema: { $ref: '#/components/schemas/DataQualityPreflight' } } } }
    ExceptionCaseCandidateResponse: { description: Non-persistent exception case candidate, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionCaseCandidate' } } } }
    ExceptionCaseReviewResponse: { description: Submitted PostgreSQL review-queue record, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionCaseReview' } } } }
    KnowledgeResponse: { description: Knowledge result, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeResult' } } } }
    NotificationPage: { description: Notification page, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
    NotificationDraftResponse: { description: Non-persistent enhanced notification body draft, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDraft' } } } }
    NotificationDeliveryResponse: { description: Accepted deterministic notification delivery, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDelivery' } } } }
    AuditPage: { description: Audit page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
    AuditFilterSuggestionResponse: { description: Editable audit-filter suggestion, content: { application/json: { schema: { $ref: '#/components/schemas/AuditFilterSuggestion' } } } }
    HealthResponse: { description: Health, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  schemas:
    Problem: { type: object, required: [type, title, status], properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string } } }
    Session: { type: object, required: [user_id, role], properties: { user_id: { type: string }, role: { type: string, enum: [admin, scheduler, operator, viewer] }, display_name: { type: string } } }
    CsrfToken: { type: object, required: [csrf_token], properties: { csrf_token: { type: string } } }
    CertificationType: { type: string, enum: [CCC, CVC, international] }
    OrderStatus: { type: string, enum: [pending_schedule, scheduled, in_progress, paused, completed, cancelled] }
    OrderInput: { type: object, required: [sample_name, sample_quantity, certification_type, priority, promised_finish_time, project_ids], properties: { sample_name: { type: string }, sample_quantity: { type: integer, minimum: 1 }, certification_type: { $ref: '#/components/schemas/CertificationType' }, priority: { type: string, enum: [normal, urgent, vip] }, promised_finish_time: { type: string, format: date-time }, project_ids: { type: array, minItems: 1, items: { type: string } } } }
    OrderPatch: { type: object, minProperties: 1, properties: { sample_name: { type: string }, sample_quantity: { type: integer, minimum: 1 }, certification_type: { $ref: '#/components/schemas/CertificationType' }, priority: { type: string, enum: [normal, urgent, vip] }, promised_finish_time: { type: string, format: date-time }, project_ids: { type: array, items: { type: string } } } }
    CreateRetestRequest: { type: object, required: [reason, project_ids], properties: { reason: { type: string, minLength: 1 }, project_ids: { type: array, minItems: 1, items: { type: string } } } }
    PauseOrderRequest: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1 } } }
    DetectionProject: { type: object, required: [id, code, name, certification_types, active], properties: { id: { type: string }, code: { type: string }, name: { type: string }, certification_types: { type: array, items: { $ref: '#/components/schemas/CertificationType' } }, active: { type: boolean } } }
    Order: { allOf: [ { $ref: '#/components/schemas/OrderInput' }, { type: object, required: [id, status, version, created_at], properties: { id: { type: string }, status: { $ref: '#/components/schemas/OrderStatus' }, version: { type: integer }, created_at: { type: string, format: date-time } } } ] }
    OrderPage: { type: object, required: [items, page, page_size, total], properties: { items: { type: array, items: { $ref: '#/components/schemas/Order' } }, page: { type: integer }, page_size: { type: integer }, total: { type: integer } } }
    Equipment: { type: object, required: [id, name, status, capacity, project_ids], properties: { id: { type: string }, name: { type: string }, status: { type: string }, capacity: { type: integer }, project_ids: { type: array, items: { type: string } }, version: { type: integer } } }
    Employee: { type: object, required: [id, name, skills], properties: { id: { type: string }, name: { type: string }, skills: { type: array, items: { type: string } }, shift_id: { type: string }, version: { type: integer } } }
    Shift: { type: object, required: [id, name, start_time, end_time], properties: { id: { type: string }, name: { type: string }, start_time: { type: string }, end_time: { type: string } } }
    Unavailability: { type: object, required: [id, entity_id, starts_at, ends_at], properties: { id: { type: string }, entity_id: { type: string }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, reason: { type: string } } }
    ScheduleStep: { type: object, required: [id, order_id, project_id, starts_at, ends_at, status, frozen], properties: { id: { type: string }, order_id: { type: string }, project_id: { type: string }, equipment_id: { type: string }, employee_ids: { type: array, items: { type: string } }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, status: { type: string }, frozen: { type: boolean }, version: { type: integer } } }
    Schedule: { type: object, required: [version, steps], properties: { version: { type: integer }, steps: { type: array, items: { $ref: '#/components/schemas/ScheduleStep' } } } }
    SchedulePreview:
      type: object
      required: [id, status, algorithm_used, solver_status, fallback_used, fallback_reason, base_schedule_version, resource_snapshot_version, frozen_step_count, changed_step_count, delayed_order_count, weighted_delay_minutes, total_delay_minutes, blockers, changes, schedule, version]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending_review, approved, rejected, conflicted, failed] }
        algorithm_used: { type: string, enum: [cp_sat, sla_fallback] }
        solver_status: { type: string }
        fallback_used: { type: boolean }
        fallback_reason: { type: [string, 'null'] }
        base_schedule_version: { type: integer }
        resource_snapshot_version: { type: integer }
        frozen_step_count: { type: integer }
        changed_step_count: { type: integer }
        delayed_order_count: { type: integer }
        weighted_delay_minutes: { type: integer }
        total_delay_minutes: { type: integer }
        blockers: { type: array, items: { type: object } }
        changes: { type: array, items: { type: object } }
        schedule: { $ref: '#/components/schemas/Schedule' }
        version: { type: integer }
      oneOf:
        - properties:
            fallback_used: { type: boolean, const: false }
            fallback_reason: { type: 'null' }
        - properties:
            fallback_used: { type: boolean, const: true }
            fallback_reason:
              type: string
              enum: [cp_sat_infeasible, cp_sat_timeout_without_feasible_solution, cp_sat_execution_error, input_size_protection_threshold_exceeded]
    SchedulePreviewPage: { type: object, required: [items, page, page_size, total], properties: { items: { type: array, items: { $ref: '#/components/schemas/SchedulePreview' } }, page: { type: integer }, page_size: { type: integer }, total: { type: integer } } }
    Event: { type: object, required: [id, event_type, entity_type, status, severity, version, occurred_at], properties: { id: { type: string }, event_type: { type: string }, entity_type: { type: string }, status: { type: string }, severity: { type: string }, entity_id: { type: string }, version: { type: integer }, occurred_at: { type: string, format: date-time }, payload: { type: object } } }
